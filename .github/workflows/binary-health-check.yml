# SPDX-License-Identifier: Apache-2.0
# Regression guard for issue #352: verify that the PyInstaller-built
# convsim-core binary starts successfully and answers /api/health within 10 s.
#
# In a frozen PyInstaller bundle the entry script executes as __main__, so the
# module convsim_core.main is not present in the frozen importer's namespace.
# Passing an import string to uvicorn.run() causes uvicorn to call
# importlib.import_module("convsim_core.main"), which raises ModuleNotFoundError
# and kills the binary before it binds a port.  This workflow catches that class
# of regression automatically on all three shipping platforms.
#
# The binary is built from source on each runner so the test exercises exactly
# the same PyInstaller code path used by the release workflow.

name: Binary health check

on:
  push:
    branches: [main]
    paths:
      - 'services/convsim-core/**'
      - 'runtimes/llama_cpp/**'
      - '.github/workflows/binary-health-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/convsim-core/**'
      - 'runtimes/llama_cpp/**'
      - '.github/workflows/binary-health-check.yml'

permissions:
  contents: read

jobs:
  binary-health-check:
    name: Binary health check / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64
            runner: ubuntu-latest
          - name: macOS-aarch64
            runner: macos-latest
          - name: Windows-x86_64
            runner: windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/convsim-core/pyproject.toml
            packages/prompt-composer/pyproject.toml

      - name: Install prompt-composer
        run: pip install -e "packages/prompt-composer"

      - name: Install convsim-core with build extras
        run: pip install -e "services/convsim-core[build]"

      - name: Build convsim-core binary with PyInstaller
        shell: bash
        working-directory: services/convsim-core
        run: python -m PyInstaller convsim-core.spec --noconfirm

      # ── Linux / macOS ──────────────────────────────────────────────────────────
      - name: Start binary and verify /api/health (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: services/convsim-core
        run: |
          set -euo pipefail
          BINARY=dist/convsim-core

          echo "=== Starting $BINARY ==="
          "$BINARY" &
          BINARY_PID=$!
          echo "Binary PID: $BINARY_PID"

          echo "=== Polling /api/health (10 s deadline) ==="
          python3 - <<'PYEOF'
          import sys, time, urllib.request, urllib.error

          deadline = time.time() + 10
          last_err = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:7355/api/health", timeout=2) as r:
                      if r.status == 200:
                          print(f"OK: /api/health responded with HTTP {r.status}")
                          sys.exit(0)
              except Exception as exc:
                  last_err = exc
              time.sleep(0.5)

          print(f"FAIL: /api/health did not respond within 10 s. Last error: {last_err}", file=sys.stderr)
          sys.exit(1)
          PYEOF

          echo "=== Stopping binary ==="
          kill "$BINARY_PID" 2>/dev/null || true

      # ── Windows ───────────────────────────────────────────────────────────────
      - name: Start binary and verify /api/health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: services/convsim-core
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "dist\convsim-core.exe"

          Write-Host "=== Starting $binary ==="
          $proc = Start-Process -FilePath $binary -PassThru -WindowStyle Hidden
          Write-Host "Binary PID: $($proc.Id)"

          Write-Host "=== Polling /api/health (10 s deadline) ==="
          $deadline = (Get-Date).AddSeconds(10)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
              try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:7355/api/health" `
                      -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "OK: /api/health responded with HTTP $($resp.StatusCode)"
                      $ok = $true
                      break
                  }
              } catch {
                  # not ready yet
              }
              Start-Sleep -Milliseconds 500
          }

          Write-Host "=== Stopping binary ==="
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}

          if (-not $ok) {
              Write-Error "FAIL: /api/health did not respond within 10 s"
              exit 1
          }

      # ── Engine platform detection smoke test (all platforms) ─────────────────
      # Verifies that detect_platform_string() now returns a valid string on
      # every shipping platform, and that the download-runtime endpoint reports
      # a non-null platform (i.e. Windows is no longer PLATFORM_NOT_SUPPORTED).
      - name: Verify engine platform detection
        shell: bash
        working-directory: services/convsim-core
        run: |
          python3 - <<'PYEOF'
          import sys
          from convsim_core.runtime.llama_cpp_download import detect_platform_string

          try:
              tag = detect_platform_string()
          except RuntimeError as exc:
              print(f"FAIL: detect_platform_string() raised on {sys.platform}: {exc}", file=sys.stderr)
              sys.exit(1)

          print(f"OK: detect_platform_string() = {tag!r} on {sys.platform}")

          # Sanity: Windows must return a win-* string, not raise.
          if sys.platform == "win32" and not tag.startswith("win-"):
              print(f"FAIL: expected win-* tag on win32, got {tag!r}", file=sys.stderr)
              sys.exit(1)

          sys.exit(0)
          PYEOF

  # ── macOS deployment-target gate (issue #469) ──────────────────────────────
  # The Steam macOS depot once shipped an upstream llama.cpp build whose Metal
  # backend was compiled for macOS 26; dyld killed llama-server at launch on
  # every supported macOS, and the setup wizard misreported it as insufficient
  # RAM.  This job downloads the pinned runtime exactly the way the release
  # workflow does (release.yml's "Bundle llama-server" step calls
  # download-runtime.sh, so it is protected transitively) and fails when any
  # bundled Mach-O binary declares a minimum macOS newer than our floor.
  llama-minos-gate:
    name: macOS deployment-target gate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Checker self-test
        run: python3 scripts/check-macho-minos.py --self-test

      # download-runtime.sh runs its own minos gate on Darwin before install,
      # so a too-new pinned runtime fails right here.
      - name: Download pinned runtime (arm64, self-gating)
        run: bash runtimes/llama_cpp/download-runtime.sh --dest "$RUNNER_TEMP/llama-arm64"

      - name: Verify installed arm64 binaries against the floor
        run: |
          FLOOR="${CONVSIM_MACOS_MINOS_FLOOR:-14.0}"
          python3 scripts/check-macho-minos.py --max "$FLOOR" "$RUNNER_TEMP/llama-arm64"

      # The x64 depot ships from the same pin; inspect that asset too (the
      # checker parses Mach-O bytes directly, so the arm64 runner can verify
      # x64 binaries without executing them).
      - name: Verify x64 release asset against the floor
        run: |
          set -euo pipefail
          FLOOR="${CONVSIM_MACOS_MINOS_FLOOR:-14.0}"
          VERSION="$(sed -n 's/^LLAMA_CPP_PINNED_VERSION="\(.*\)"$/\1/p' runtimes/llama_cpp/download-runtime.sh)"
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not read LLAMA_CPP_PINNED_VERSION from download-runtime.sh" >&2
            exit 1
          fi
          echo "Pinned llama.cpp version: $VERSION"
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${VERSION}/llama-${VERSION}-bin-macos-x64.tar.gz"
          curl -fSL --retry 3 -o "$RUNNER_TEMP/x64.tar.gz" "$URL"
          mkdir -p "$RUNNER_TEMP/llama-x64"
          tar -xzf "$RUNNER_TEMP/x64.tar.gz" -C "$RUNNER_TEMP/llama-x64"
          python3 scripts/check-macho-minos.py --max "$FLOOR" "$RUNNER_TEMP/llama-x64"

# SPDX-License-Identifier: Apache-2.0
# Regression guard for issue #352: verify that the PyInstaller-built
# convsim-core binary starts successfully and answers /api/health within 10 s.
#
# In a frozen PyInstaller bundle the entry script executes as __main__, so the
# module convsim_core.main is not present in the frozen importer's namespace.
# Passing an import string to uvicorn.run() causes uvicorn to call
# importlib.import_module("convsim_core.main"), which raises ModuleNotFoundError
# and kills the binary before it binds a port.  This workflow catches that class
# of regression automatically on all three shipping platforms.
#
# The binary is built from source on each runner so the test exercises exactly
# the same PyInstaller code path used by the release workflow.

name: Binary health check

on:
  push:
    branches: [main]
    paths:
      - 'services/convsim-core/**'
      - 'runtimes/llama_cpp/**'
      - '.github/workflows/binary-health-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/convsim-core/**'
      - 'runtimes/llama_cpp/**'
      - '.github/workflows/binary-health-check.yml'

permissions:
  contents: read

jobs:
  binary-health-check:
    name: Binary health check / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64
            runner: ubuntu-latest
          - name: macOS-aarch64
            runner: macos-latest
          - name: Windows-x86_64
            runner: windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/convsim-core/pyproject.toml
            packages/prompt-composer/pyproject.toml

      - name: Install prompt-composer
        run: pip install -e "packages/prompt-composer"

      - name: Install convsim-core with build extras
        run: pip install -e "services/convsim-core[build]"

      - name: Build convsim-core binary with PyInstaller
        shell: bash
        working-directory: services/convsim-core
        run: python -m PyInstaller convsim-core.spec --noconfirm

      # ── Linux / macOS ──────────────────────────────────────────────────────────
      - name: Start binary and verify /api/health (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: services/convsim-core
        run: |
          set -euo pipefail
          BINARY=dist/convsim-core

          echo "=== Starting $BINARY ==="
          "$BINARY" &
          BINARY_PID=$!
          echo "Binary PID: $BINARY_PID"

          echo "=== Polling /api/health (10 s deadline) ==="
          python3 - <<'PYEOF'
          import sys, time, urllib.request, urllib.error

          deadline = time.time() + 10
          last_err = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:7355/api/health", timeout=2) as r:
                      if r.status == 200:
                          print(f"OK: /api/health responded with HTTP {r.status}")
                          sys.exit(0)
              except Exception as exc:
                  last_err = exc
              time.sleep(0.5)

          print(f"FAIL: /api/health did not respond within 10 s. Last error: {last_err}", file=sys.stderr)
          sys.exit(1)
          PYEOF

          echo "=== Stopping binary ==="
          kill "$BINARY_PID" 2>/dev/null || true

      # ── Windows ───────────────────────────────────────────────────────────────
      - name: Start binary and verify /api/health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: services/convsim-core
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "dist\convsim-core.exe"

          Write-Host "=== Starting $binary ==="
          $proc = Start-Process -FilePath $binary -PassThru -WindowStyle Hidden
          Write-Host "Binary PID: $($proc.Id)"

          Write-Host "=== Polling /api/health (10 s deadline) ==="
          $deadline = (Get-Date).AddSeconds(10)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
              try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:7355/api/health" `
                      -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "OK: /api/health responded with HTTP $($resp.StatusCode)"
                      $ok = $true
                      break
                  }
              } catch {
                  # not ready yet
              }
              Start-Sleep -Milliseconds 500
          }

          Write-Host "=== Stopping binary ==="
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}

          if (-not $ok) {
              Write-Error "FAIL: /api/health did not respond within 10 s"
              exit 1
          }

      # ── Launcher-exit teardown (issue #485, all platforms) ───────────────────
      # The desktop shell stops the engine by closing a pipe it holds on the
      # engine's stdin; `convsim_core.parent_watch` reads EOF and asks uvicorn
      # for a graceful shutdown. Everything about that rests on a property only
      # the PACKAGED binary has: this is a PyInstaller one-file bundle, so the
      # process we spawn is a bootloader that runs the real Python server as a
      # child of its own, and the pipe has to reach THAT child. Nothing in the
      # unit tests can see it — tests/test_parent_watch.py drives an unfrozen
      # interpreter, and the Rust tests in core_process.rs stand a shell script
      # in for the engine. Without this step the bug reported on Windows
      # (convsim-core.exe left holding port 7355, Steam still reporting the game
      # as running) could come back on any platform and CI would stay green.
      #
      # Asserting the port is released is the point: the bootloader exiting only
      # proves the outer process went; the port is owned by the inner server, so
      # a freed port is the only proof that the whole tree is down.
      #
      # The opposite regression — an engine that exits the moment it boots —
      # is covered by the health-check steps above, which start the binary with
      # neither the pipe nor the opt-in (a backgrounded job in a non-interactive
      # shell gets /dev/null on stdin, i.e. immediate EOF) and require it to
      # answer /api/health.
      - name: Verify the binary shuts down when its launcher closes stdin
        shell: bash
        working-directory: services/convsim-core
        run: |
          python3 - <<'PYEOF'
          import os
          import socket
          import subprocess
          import sys
          import tempfile
          import time

          PORT = 7399  # not 7355 (used above) and not 7356 (llama-server default)
          binary = os.path.join("dist", "convsim-core.exe" if os.name == "nt" else "convsim-core")

          env = dict(os.environ)
          env.update({
              "CONVSIM_HOST": "127.0.0.1",
              "CONVSIM_PORT": str(PORT),
              # The launcher opt-in the Tauri shell sets (SHUTDOWN_ON_STDIN_EOF_ENV
              # in apps/desktop/src-tauri/src/core_process.rs).
              "CONVSIM_SHUTDOWN_ON_STDIN_EOF": "1",
              "CONVSIM_DATA_ROOT": tempfile.mkdtemp(prefix="convsim-485-"),
          })

          def port_open():
              with socket.socket() as s:
                  s.settimeout(0.5)
                  try:
                      s.connect(("127.0.0.1", PORT))
                      return True
                  except OSError:
                      return False

          # Spawned exactly as the shell spawns it: a pipe on stdin that the
          # launcher holds open for its own lifetime.
          proc = subprocess.Popen([binary], stdin=subprocess.PIPE, env=env)

          deadline = time.time() + 90  # first run of a one-file bundle unpacks itself
          while time.time() < deadline:
              if port_open():
                  break
              if proc.poll() is not None:
                  print(f"FAIL: engine exited during startup (rc={proc.returncode})", file=sys.stderr)
                  sys.exit(1)
              time.sleep(0.5)
          else:
              print("FAIL: engine never bound its port", file=sys.stderr)
              proc.kill()
              sys.exit(1)
          print(f"OK: engine healthy on :{PORT} (launcher sees pid {proc.pid})")

          # Closing the pipe is the entire shutdown request — no signal, no pid.
          started = time.time()
          proc.stdin.close()
          try:
              # The engine's own worst case is ~8 s (3 s draining requests + 5 s
              # stopping sidecars); the shell allows 10 s before killing the tree.
              rc = proc.wait(timeout=30)
          except subprocess.TimeoutExpired:
              print("FAIL: engine still running 30 s after its launcher closed stdin", file=sys.stderr)
              proc.kill()
              sys.exit(1)
          print(f"OK: engine exited {time.time() - started:.2f}s after stdin closed (rc={rc})")

          # The inner Python server owns the port, so this is what proves the
          # bootloader did not just take itself down and orphan the server.
          deadline = time.time() + 10
          while time.time() < deadline:
              if not port_open():
                  print(f"OK: port {PORT} released — nothing left holding it")
                  sys.exit(0)
              time.sleep(0.5)

          print(f"FAIL: port {PORT} still held — the engine behind the bootloader survived", file=sys.stderr)
          sys.exit(1)
          PYEOF

      # ── The shipping engines (issue #530, Windows and Linux) ─────────────────
      # Installs both pinned builds exactly the way release.yml bundles them —
      # the CPU build flat, the Vulkan build in vulkan/ — with the same scripts,
      # which verify each archive against runtimes/llama_cpp/pin.json and fail
      # on a missing or mismatched digest. Then the CPU build must run
      # `--list-devices` and exit 0 from its own directory (how the app starts
      # it), and must not sit beside the Vulkan backend library. The Vulkan
      # build's device list is printed for the log only: runners have no card.
      - name: Install both pinned engines and run the CPU engine (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/runtimes"
          bash runtimes/llama_cpp/download-runtime.sh --dest "$DIR"
          bash runtimes/llama_cpp/download-runtime.sh --variant vulkan --dest "$DIR/vulkan"
          if find "$DIR" -maxdepth 1 -iname '*ggml-vulkan*' | grep -q .; then
            echo "FAIL: Vulkan backend library beside the CPU engine" >&2; exit 1
          fi
          (cd "$DIR" && ./llama-server --list-devices)
          (cd "$DIR/vulkan" && ./llama-server --list-devices) || echo "INFO: no Vulkan device on this runner"
          du -sh "$DIR" "$DIR/vulkan"

      - name: Install both pinned engines and run the CPU engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP "runtimes"
          .\runtimes\llama_cpp\download-runtime.ps1 -Variant cpu -Dest $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\runtimes\llama_cpp\download-runtime.ps1 -Variant vulkan -Dest "$dir\vulkan"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-ChildItem $dir -File -Filter '*ggml-vulkan*') {
            Write-Error "FAIL: Vulkan backend library beside the CPU engine"; exit 1
          }
          Push-Location $dir
          & .\llama-server.exe --list-devices
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { Write-Error "FAIL: the CPU engine's --list-devices exited $rc"; exit 1 }
          Push-Location "$dir\vulkan"
          & .\llama-server.exe --list-devices
          if ($LASTEXITCODE -ne 0) { Write-Host "INFO: no Vulkan device on this runner" }
          Pop-Location
          $global:LASTEXITCODE = 0

      # ── Engine platform detection smoke test (all platforms) ─────────────────
      # Verifies that detect_platform_string() now returns a valid string on
      # every shipping platform, and that the download-runtime endpoint reports
      # a non-null platform (i.e. Windows is no longer PLATFORM_NOT_SUPPORTED).
      - name: Verify engine platform detection
        shell: bash
        working-directory: services/convsim-core
        run: |
          python3 - <<'PYEOF'
          import sys
          from convsim_core.runtime.llama_cpp_download import detect_platform_string

          try:
              tag = detect_platform_string()
          except RuntimeError as exc:
              print(f"FAIL: detect_platform_string() raised on {sys.platform}: {exc}", file=sys.stderr)
              sys.exit(1)

          print(f"OK: detect_platform_string() = {tag!r} on {sys.platform}")

          # Sanity: Windows must return a win-* string, not raise.
          if sys.platform == "win32" and not tag.startswith("win-"):
              print(f"FAIL: expected win-* tag on win32, got {tag!r}", file=sys.stderr)
              sys.exit(1)

          sys.exit(0)
          PYEOF

  # ── macOS deployment-target gate (issue #469) ──────────────────────────────
  # The Steam macOS depot once shipped an upstream llama.cpp build whose Metal
  # backend was compiled for macOS 26; dyld killed llama-server at launch on
  # every supported macOS, and the setup wizard misreported it as insufficient
  # RAM.  This job downloads the pinned runtime exactly the way the release
  # workflow does (release.yml's "Bundle llama-server" step calls
  # download-runtime.sh, so it is protected transitively) and fails when any
  # bundled Mach-O binary declares a minimum macOS newer than our floor.
  llama-minos-gate:
    name: macOS deployment-target gate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Checker self-test
        run: python3 scripts/check-macho-minos.py --self-test

      # download-runtime.sh runs its own minos gate on Darwin before install,
      # so a too-new pinned runtime fails right here.
      - name: Download pinned runtime (arm64, self-gating)
        run: bash runtimes/llama_cpp/download-runtime.sh --dest "$RUNNER_TEMP/llama-arm64"

      - name: Verify installed arm64 binaries against the floor
        run: |
          FLOOR="${CONVSIM_MACOS_MINOS_FLOOR:-14.0}"
          python3 scripts/check-macho-minos.py --max "$FLOOR" "$RUNNER_TEMP/llama-arm64"

      # The x64 depot ships from the same pin; inspect that asset too (the
      # checker parses Mach-O bytes directly, so the arm64 runner can verify
      # x64 binaries without executing them).
      # The x64 asset is fetched with the shipping script too (a platform
      # override makes it fetch the x64 archive on this arm64 runner), so it is
      # verified against its pinned SHA-256 before the gate inspects it.
      - name: Verify x64 release asset against the floor
        env:
          CONVSIM_LLAMA_CPP_PLATFORM: macos-x64
        run: |
          set -euo pipefail
          FLOOR="${CONVSIM_MACOS_MINOS_FLOOR:-14.0}"
          bash runtimes/llama_cpp/download-runtime.sh --dest "$RUNNER_TEMP/llama-x64"
          python3 scripts/check-macho-minos.py --max "$FLOOR" "$RUNNER_TEMP/llama-x64"

  # ── Every pinned engine archive matches its pinned SHA-256 (issue #530) ────
  # Upstream publishes no checksum file; runtimes/llama_cpp/pin.json is the only
  # thing that verifies an engine download. This job downloads every archive
  # the pin names and checks it against the pin, and checks the pin against
  # the digest GitHub's release API reports for each asset — so a typo in the
  # pin, an asset re-uploaded upstream, or an archive added without a digest
  # fails here, on the pull request that caused it.
  llama-pin-verify:
    name: Pinned engine archives match their SHA-256
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download every pinned archive and verify its digest
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, sys, urllib.request

          pin = json.load(open("runtimes/llama_cpp/pin.json"))
          tag = pin["tag"]
          failed = []
          for name, expected in sorted(pin["sha256"].items()):
              url = f"https://github.com/ggml-org/llama.cpp/releases/download/{tag}/{name}"
              digest = hashlib.sha256()
              size = 0
              with urllib.request.urlopen(url, timeout=300) as resp:
                  for chunk in iter(lambda: resp.read(1 << 20), b""):
                      digest.update(chunk)
                      size += len(chunk)
              actual = digest.hexdigest()
              ok = actual == expected
              print(f"{'OK  ' if ok else 'FAIL'} {name} ({size / 1e6:.1f} MB) {actual}")
              if not ok:
                  failed.append(name)
          if failed:
              print(f"FAIL: {len(failed)} archive(s) do not match runtimes/llama_cpp/pin.json", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: The pin matches GitHub's release digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(python3 -c 'import json; print(json.load(open("runtimes/llama_cpp/pin.json"))["tag"])')"
          gh api "repos/ggml-org/llama.cpp/releases/tags/${TAG}" \
            --jq '.assets[] | [.name, (.digest // "")] | @tsv' > "$RUNNER_TEMP/digests.tsv"
          python3 - "$RUNNER_TEMP/digests.tsv" <<'PYEOF'
          import json, sys

          pin = json.load(open("runtimes/llama_cpp/pin.json"))["sha256"]
          api = {}
          for line in open(sys.argv[1]):
              name, _, digest = line.rstrip("\n").partition("\t")
              api[name] = digest.removeprefix("sha256:")
          failed = False
          for name, expected in sorted(pin.items()):
              if api.get(name) != expected:
                  print(f"FAIL {name}: pin {expected}, release API {api.get(name) or 'no such asset'}", file=sys.stderr)
                  failed = True
              else:
                  print(f"OK   {name}")
          sys.exit(1 if failed else 0)
          PYEOF

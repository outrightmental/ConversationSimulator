# SPDX-License-Identifier: Apache-2.0
# Public marketing site for https://conversationsimulator.com
# Built with Hugo (extended). Deployed by .github/workflows/deploy-website.yml.

# www is the canonical host: during the domain lease, DNS is served by
# GoDaddy DNS, which cannot alias the bare apex to CloudFront; the apex
# 301-forwards to www instead.
baseURL = 'https://www.conversationsimulator.com/'
languageCode = 'en-us'
title = 'Conversation Simulator'
timeZone = 'UTC'

# Marketing site: no taxonomies, no RSS. Sitemap and 404 stay on.
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  description = 'The simulator for conversations. Practice interviews, negotiations, language, and difficult conversations with AI characters that run 100% on your computer — no account, no cloud, no telemetry.'
  docsURL = 'https://docs.conversationsimulator.com'
  githubURL = 'https://github.com/outrightmental/ConversationSimulator'
  releasesURL = 'https://github.com/outrightmental/ConversationSimulator/releases/latest'

# Google Analytics (GA4) for the public marketing site only — the app itself
# ships no telemetry. Hugo's built-in gtag.js template reads this ID and only
# emits the tag in production builds, so `hugo server` never sends hits.
[services.googleAnalytics]
  ID = 'G-VVJELQ8MED'

# Signal: Outright Mental's own first-party, aggregate-only analytics, for the
# website only (the app sends nothing). Every page carries a ladder of 1x1
# images, counted by Signal's server with no script, cookie or id
# (layouts/partials/signal-ladder.html); the client script adds journeys only
# after a visitor says yes (layouts/partials/signal.html). Both render only in a
# production build for `host` that the deploy workflow marks with
# SIGNAL_DEPLOY=production, so `hugo server`, a local build and anything that is
# not the deployed site never count into the stream. Described for visitors at
# docs.conversationsimulator.com/trust/privacy/#these-websites.
[params.signal]
  key = 'conversationsimulator-com.86b0489a6c355f6d74edb087'
  ingest = 'https://in.signal.outright.io'
  script = 'https://signal.outright.io/w/signal.js'
  host = 'www.conversationsimulator.com'
  privacy = 'https://docs.conversationsimulator.com/trust/privacy/#these-websites'
  # The studio's hosts a journey may cross (a link to one carries `#sx=`).
  # The same list, in the same order, on every studio site and in
  # docs-site/src/signal.mjs; outrightmental.com/privacy/ lists them for visitors.
  studio = [
    'outrightmental.com', 'nickcharneykaye.com', 'apescorporation.com', 'fevertilt.com',
    'starharvester.com', 'zero.starharvester.com', 'umlaut-hero.com',
    'conversationsimulator.com', 'docs.conversationsimulator.com', 'xjmusic.com',
    'docs.xjmusic.com', 'podcast.xjmusic.com', 'outright.io', 'agendar.outright.io',
    'wetware.outright.io', 'etymolution.com', 'makeitmoreinteresting.com',
    'interesting.outright.io', 'ascendinglark.com', 'garden.ascendinglark.com',
  ]

# getenv is limited to these names. The first two are Hugo's defaults;
# SIGNAL_DEPLOY is set by .github/workflows/deploy-website.yml only.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^SIGNAL_DEPLOY$']

[markup.goldmark.renderer]
  # Content pages embed small pieces of structural HTML (e.g. the download cards).
  unsafe = true

[sitemap]
  changefreq = 'weekly'

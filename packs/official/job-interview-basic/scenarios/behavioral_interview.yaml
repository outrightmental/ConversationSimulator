schema_version: "0.1"
scenario_id: behavioral_interview
title: The Behavioral Interview
summary: >-
  You are interviewing for a Software Engineer role at Meridian Systems, a
  mid-sized B2B tech company. Dana Reyes, the Engineering Manager, will ask
  behavioral questions about your past experience. Specific, structured answers
  using the STAR method earn a stronger impression; vague platitudes lower it.
player_role:
  label: Job Candidate
  brief: >-
    You are applying for a mid-level Software Engineer position. You have relevant
    experience but need to convince Dana that you can handle ambiguous problems,
    collaborate well, and grow from mistakes. This is your final-round interview
    before a hiring decision is made.
npc:
  ref: ../npcs/hiring_manager.yaml
scene:
  ref: ../scenes/meridian_conference_room.yaml
rubric:
  ref: ../rubrics/interview_rubric.yaml
duration:
  max_turns: 20
  soft_time_limit_minutes: 15
opening:
  npc_says: >-
    Good morning! Thanks so much for making the time. I'm Dana Reyes, Engineering
    Manager on the platform team here at Meridian Systems. I've looked over your
    resume — very interesting background. To kick things off, tell me about a time
    when you had to work through a difficult technical problem under real pressure.
    What was the situation, and how did you handle it?
goals:
  player_visible:
    - "Impress Dana with specific, concrete examples from your past work"
    - "Build rapport and show genuine enthusiasm for the role"
    - "Demonstrate self-awareness about your strengths and areas for growth"
  hidden:
    - "Dana is testing whether you use vague platitudes or real examples with measurable outcomes"
    - "Dana wants to see how you handle ambiguity and whether you own your mistakes"
    - "Dana is watching for cultural fit — curiosity, collaboration, and candor under mild pressure"
state:
  variables:
    impression:
      min: 0
      max: 100
      default: 50
      visibility: visible
      max_delta_per_turn: 6
      description: >-
        Dana's read of the candidate as a hire. Rises with concrete examples
        that end in a result, or an owned mistake; falls with platitudes,
        rambling or blame.
    rapport:
      min: 0
      max: 100
      default: 40
      visibility: visible
      max_delta_per_turn: 10
      description: >-
        How candid the talk feels to Dana. Rises with honesty and curiosity
        about her team; falls with evasive or rehearsed replies.
    rambling_count:
      min: 0
      max: 10
      default: 0
      visibility: hidden
      max_delta_per_turn: 2
      description: >-
        Answers that ran long without a point. Add 1 when one wanders, take 1
        off for a focused one, else 0.
    specificity_score:
      min: 0
      max: 100
      default: 50
      visibility: hidden
      max_delta_per_turn: 15
      description: >-
        How concrete the answers are. Rises with a real situation, their own
        part and a measurable outcome; falls with general claims.
difficulty:
  default: standard
  options:
    warm:
      patience: 80
      volatility: 20
      disclosure: 70
      time_pressure: 20
      label: Warm-up
      description: Dana is encouraging and will guide you if you drift — good for first interviews.
    standard:
      patience: 50
      volatility: 50
      disclosure: 50
      time_pressure: 50
      label: Standard
      description: Realistic interview pacing — Dana probes vague answers and expects concrete examples.
    hard:
      patience: 25
      volatility: 70
      disclosure: 25
      time_pressure: 60
      label: Hard
      description: Dana is exacting; one unfocused answer can drop her impression score sharply.
    adversarial:
      patience: 10
      volatility: 90
      disclosure: 10
      time_pressure: 80
      label: Adversarial
      description: Dana is near-silent between probes, state is extremely reactive, and time is tight.
events:
  - id: rambling_redirect
    when:
      type: variable_above
      variable: rambling_count
      threshold: 2
    npc_instruction: >-
      The candidate has been giving lengthy, unfocused answers. Gently but firmly
      redirect: "That's helpful context — let me zoom in. Can you walk me through
      one specific situation? What exactly did you do, and what was the result?"
    repeat: true
  - id: high_specificity_reward
    when:
      type: variable_above
      variable: specificity_score
      threshold: 75
    npc_instruction: >-
      The candidate's answers have become impressively specific and well
      structured. Show genuine engagement: pick up a concrete detail from their
      latest answer, and follow up with a deeper question such as what they
      learned from the experience or how they would approach it differently
      today.
    repeat: false
  # It repeats (#580): unless impression then falls below 15 no ending follows
  # the wrap-up, and fired once, its instruction left the prompt the turn
  # after Dana asked her "one last thing", and the interview carried on.
  - id: low_impression_warning
    when:
      type: variable_below
      variable: impression
      threshold: 25
    npc_instruction: >-
      Dana is losing confidence in this candidate. If she has not signalled
      yet that time is short, she begins wrapping up the interview with one
      final question: "We're getting close to time — let me ask you one last
      thing before we wrap up." Once she has, she asks nothing new: she
      acknowledges the answer briefly and closes the interview politely.
    repeat: true
# Pacing (#580): impression starts at 50 and moves at most 6 a turn, so
# success (above 70) takes four turns at the limit and failure (below 15) six.
# At 15 a turn, two strong answers ended the interview.
ending_conditions:
  success:
    type: variable_above
    variable: impression
    threshold: 70
  failure:
    type: variable_below
    variable: impression
    threshold: 15
replay_seed: 42

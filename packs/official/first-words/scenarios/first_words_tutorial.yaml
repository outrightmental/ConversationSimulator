# SPDX-License-Identifier: Apache-2.0
# "First Words" tutorial scenario — scripted runtime, zero inference required.
# Designed to be played in the first 60 seconds after install, while the
# starter model downloads in the background.
schema_version: "0.1"
scenario_id: first_words_tutorial
title: First Words
summary: >-
  A 3–5 minute guided tour of Conversation Simulator with Alex Chen, a
  friendly tutorial guide. Alex shows you the two meters, the turning point
  mid-conversation, the ways a conversation can end, and the debrief — and
  answers your questions along the way. The replies are scripted, not AI, so
  no model download is needed.
player_role:
  label: New Player
  brief: >-
    You just installed Conversation Simulator. Alex Chen is here to show you
    how the app works before you jump into a real scenario. There's no wrong
    answer — just respond naturally and follow where Alex leads.
npc:
  ref: ../npcs/alex_chen.yaml
rubric:
  ref: ../rubrics/tutorial_rubric.yaml
duration:
  # One whole turn is the player's message plus Alex's reply — the unit
  # turn_count increments in, and now the unit the transcript labels
  # (issue #501 §4). Six of these are the tour; the rest are headroom for the
  # questions the scripted runtime now answers, each of which costs a turn.
  max_turns: 12
  soft_time_limit_minutes: 6
opening:
  npc_says: >-
    Welcome! I'm Alex Chen, your tutorial guide. This is Conversation Simulator
    — a private, offline practice space for conversations that matter. Above
    this conversation you'll see two meters: Engagement, which is how
    interested I am, and Confidence, which is how sure of yourself you're
    coming across. They move every turn, based on what you write. Go ahead —
    say anything to get us started, or ask me about anything you see.
goals:
  player_visible:
    - "See how the two meters move as you talk"
    - "Reach the turning point where the conversation changes course"
    - "Finish the tutorial and open the scenario library"
  hidden:
    - "Alex is tracking whether the player seems curious about how the mechanics work"
    - "Alex wants the player to leave feeling ready to try a real scenario"
state:
  variables:
    engagement:
      min: 0
      max: 100
      default: 30
      visibility: visible
      max_delta_per_turn: 20
    confidence:
      min: 0
      max: 100
      default: 50
      visibility: visible
      max_delta_per_turn: 15
difficulty:
  default: standard
  options:
    standard:
      patience: 100
      volatility: 0
      disclosure: 100
      time_pressure: 0
      label: Tutorial
      description: The only difficulty level — all mechanics are shown at full disclosure, no time pressure.
events:
  - id: warm_moment
    when:
      type: variable_above
      variable: engagement
      threshold: 60
    npc_instruction: >-
      The player has shown genuine engagement and Engagement has crossed 60.
      Warmly acknowledge the moment and use it as a teaching point, in the
      player's words rather than the simulator's: a meter crossed a mark, your
      private instructions changed, and you will behave differently for the
      rest of the conversation. Do not use the words "event", "flag", "state"
      or "prompt".
    repeat: false
ending_conditions:
  # The scripted runtime ends the session on its final turn via session_control
  # (ending_type=success, keyword-branched to the player's last message). We do
  # NOT add a variable-based `success` condition here: engagement must climb past
  # 60 to fire the warm_moment event, so any lower success threshold would end the
  # tutorial before the event fires and before the endings/debrief lesson. Timeout
  # is the only scenario-level safety net.
  timeout:
    type: max_turns
    value: 12
taught_dimensions:
  - engagement
  - comprehension
tested_dimensions:
  - engagement
  - comprehension
replay_seed: 1

schema_version: "0.1"
scenario_id: whitechapel_rose
title: The Scorned Rose of Whitechapel
summary: >-
  You are a woman this man ruined and discarded, and you have found him on the
  steps of his club with an audience. His respectability is the attack surface.
  Period diction is scored: the sting lands hardest in the language of the room
  he is trying to keep you out of.
mode: flyting
player_role:
  label: The Scorned Rose
  brief: >-
    Ruined, discarded, and entirely composed. You have had six months to think
    about what you would say, and the cab drivers are listening. You are not
    here for money and not here for a scene — you are here to be specific in
    front of witnesses.
npc:
  ref: ../npcs/lord_bellingham.yaml
scene:
  ref: ../scenes/pall_mall_club_steps.yaml
rubric:
  ref: ../rubrics/flyting_rubric.yaml
duration:
  max_turns: 20
  soft_time_limit_minutes: 12
opening:
  npc_says: >-
    I do not know this woman. Doorman — I do not know this woman. Madam, you
    have the wrong house, the wrong street, and very nearly the wrong city.
goals:
  player_visible:
    - "Be specific: name a thing only he could be accused of"
    - "Stay in the register of the street and the period — the diction is scored"
    - "Vary your angle; the third joke about the same subject is worth almost nothing"
  hidden:
    - "He will grow louder and more respectable the closer a volley lands"
    - "His cowardice and his grandfather's tripe stall are not in your brief — find them"
state:
  variables:
    momentum:
      min: 0
      max: 100
      default: 50
      visibility: visible
      max_delta_per_turn: 12
difficulty:
  default: standard
  options:
    warm:
      patience: 70
      volatility: 30
      disclosure: 60
      time_pressure: 20
      label: Rehearsed
      description: Lexicon hints are shown and he answers mildly — good for a first run.
    standard:
      patience: 50
      volatility: 50
      disclosure: 50
      time_pressure: 50
      label: On the Steps
      description: The club is listening and he is fighting for the street's opinion.
    hard:
      patience: 30
      volatility: 70
      disclosure: 30
      time_pressure: 65
      label: Witnesses
      description: He is quick, loud, and three members are on the top step.
flyting:
  formats: [bout, batting_practice]
  bout:
    rounds: 8
    momentum_win: 85
    momentum_k: 4
    riposte_bonus: 15
    npc_tier: wildean
  batting_practice:
    shot_clock_s: 20
    formats: [timed_90, set_10, endless]
  difficulty_multiplier: 1.2
  lexicon:
    encouraged:
      - scoundrel
      - blackguard
      - plate
      - sterling
      - pledge
      - chapel
      - magistrate
      - ha'penny-gilt
    discouraged:
      - podcast
      - algorithm
      - email
      - influencer
      - vibe
    anachronism_policy: penalize
  register:
    notes: >-
      1878, in the street, in front of men who dine with him. Scripture,
      ledgers, tailoring, and the magistrate are all fair instruments.
  verse:
    required: false
  judge_flavor: >-
    A retired music-hall chairman who has heard every joke in London twice.
    Cockney. Unimpressable. Keeps the gavel in his coat pocket.

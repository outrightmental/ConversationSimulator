schema_version: "0.1"
rubric_id: flyting_rubric
title: The Flyting Rubric
dimensions:
  - id: sting
    name: Sting
    description: >-
      Does the volley land on this target, rather than on anyone who happens to
      be standing there? Aim is the difference between an insult and abuse.
    scoring:
      low: >-
        Generic abuse. Nothing in the line could only be said to this character.
      medium: >-
        Aimed at something real about the target, but glancing off it.
      high: >-
        Lands squarely on a declared trait and carries its own evidence.
    weight: 0.35
  - id: wit
    name: Wit
    description: >-
      Surprise, cleverness, economy. The turn you did not see coming, in as few
      words as it takes.
    scoring:
      low: Two labels in a row. No turn, no surprise.
      medium: One small turn, in a predictable shape.
      high: The whole indictment compressed into one unexpected image.
    weight: 0.25
  - id: craft
    name: Craft
    description: >-
      Imagery, construction, sound. Whether the line was built or merely
      emitted.
    scoring:
      low: No construction, no rhythm, no image.
      medium: A clean two-beat shape and nothing beyond it.
      high: A figure that resolves, with sound to carry it.
    weight: 0.20
  - id: fidelity
    name: Fidelity
    description: >-
      In-character voice, period diction, register compliance. The scene's own
      language turned into the weapon.
    scoring:
      low: The register is broken outright — modern slang in a period room.
      medium: In register but colourless.
      high: The diction of the scene used as the instrument of the insult.
    weight: 0.20

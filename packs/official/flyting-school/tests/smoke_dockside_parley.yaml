# SPDX-License-Identifier: CC-BY-4.0
schema_version: "0.1"
fixture_id: smoke_dockside_parley
scenario_id: dockside_parley
description: >-
  Smoke fixture for The Dockside Parley: three volleys that must each be accepted by the
  Stage 0 gates, move the momentum meter, and leave the run in progress. The
  scored expectations for this scenario live in calibration/dockside_parley.yaml, which
  the flyting calibration runner executes.

seed: 7
input_mode: text
difficulty: standard
turns:
  - turn: 1
    player_input: >-
      Read us the charter, Captain. Slowly. Three ports have laughed at the spelling.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

  - turn: 2
    player_input: >-
      Your Lark is fast because you sold the half of her that slowed her down.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

  - turn: 3
    player_input: >-
      Ask your bosun where the cook went. Tortuga is a long way to walk for soup.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

static_assertions:
  - description: The scenario declares the flyting turn loop
    path: mode
    check: equals flyting
  - description: The flyting block offers at least one play format
    path: flyting.formats
    check: min_length_1
  - description: The bout runs 8 rounds with the wildean opponent tier
    path: flyting.bout
    check: "rounds=8 AND npc_tier=wildean"
  - description: The scenario difficulty multiplier is 1.0
    path: flyting.difficulty_multiplier
    check: equals 1.0
  - description: Verse scoring is false for this scenario
    path: flyting.verse.required
    check: equals false
  - description: Momentum is an ordinary state variable with a per-turn clamp
    path: state.variables.momentum
    check: "max_delta_per_turn=20 AND default=50"
  - description: The target declares an attack surface for hooks to verify against
    path: npc.attack_surface
    check: min_length_1
  - description: The umpire has a voice
    path: flyting.judge_flavor
    check: non_empty_string

# SPDX-License-Identifier: CC-BY-4.0
schema_version: "0.1"
fixture_id: smoke_mead_hall_flyting
scenario_id: mead_hall_flyting
description: >-
  Smoke fixture for The Mead-Hall Flyting: three volleys that must each be accepted by the
  Stage 0 gates, move the momentum meter, and leave the run in progress. The
  scored expectations for this scenario live in calibration/mead_hall_flyting.yaml, which
  the flyting calibration runner executes.

seed: 7
input_mode: text
difficulty: standard
turns:
  - turn: 1
    player_input: >-
      Bench-breaker, boast-brewer, bellower of borrowed battles, your whale was a cup.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

  - turn: 2
    player_input: >-
      Thin-tongued Thorvald, theft-rhymer, your kennings came off another man's bench.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

  - turn: 3
    player_input: >-
      Fjord-farer, foam-fearer, finest of all who never left the sight of the jetty.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

static_assertions:
  - description: The scenario declares the flyting turn loop
    path: mode
    check: equals flyting
  - description: The flyting block offers at least one play format
    path: flyting.formats
    check: min_length_1
  - description: The bout runs 8 rounds with the unhinged_taunter opponent tier
    path: flyting.bout
    check: "rounds=8 AND npc_tier=unhinged_taunter"
  - description: The scenario difficulty multiplier is 1.4
    path: flyting.difficulty_multiplier
    check: equals 1.4
  - description: Verse scoring is true for this scenario
    path: flyting.verse.required
    check: equals true
  - description: Momentum is an ordinary state variable with a per-turn clamp
    path: state.variables.momentum
    check: "max_delta_per_turn=15 AND default=50"
  - description: The target declares an attack surface for hooks to verify against
    path: npc.attack_surface
    check: min_length_1
  - description: The umpire has a voice
    path: flyting.judge_flavor
    check: non_empty_string

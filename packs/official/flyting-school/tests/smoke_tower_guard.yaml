schema_version: "0.1"
fixture_id: smoke_tower_guard
scenario_id: tower_guard
description: >-
  Smoke fixture for The Tower Guard: three volleys that must each be accepted by the
  Stage 0 gates, move the momentum meter, and leave the run in progress. The
  scored expectations for this scenario live in calibration/tower_guard.yaml, which
  the flyting calibration runner executes.

seed: 7
input_mode: text
difficulty: standard
turns:
  - turn: 1
    player_input: >-
      Keeper of the Lesser Seal, and the Greater one has never once mentioned you.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

  - turn: 2
    player_input: >-
      Eleven years on that road and the only thing you have conquered is the smell.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

  - turn: 3
    player_input: >-
      Turn the map, sir. Your quest has been pointing at your own boots since Tuesday.
    expect:
      state_delta_contains:
        - momentum
      session_control: continue_session
      safety_status: ok

static_assertions:
  - description: The scenario declares the flyting turn loop
    path: mode
    check: equals flyting
  - description: The flyting block offers at least one play format
    path: flyting.formats
    check: min_length_1
  - description: The bout runs 8 rounds with the milquetoast opponent tier
    path: flyting.bout
    check: "rounds=8 AND npc_tier=milquetoast"
  - description: The scenario difficulty multiplier is 1.15
    path: flyting.difficulty_multiplier
    check: equals 1.15
  - description: Verse scoring is false for this scenario
    path: flyting.verse.required
    check: equals false
  - description: Momentum is an ordinary state variable with a per-turn clamp
    path: state.variables.momentum
    check: "max_delta_per_turn=15 AND default=50"
  - description: The target declares an attack surface for hooks to verify against
    path: npc.ref
    check: non_empty_string
  - description: The umpire has a voice
    path: flyting.judge_flavor
    check: non_empty_string
